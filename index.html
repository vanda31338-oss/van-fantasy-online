<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1430" />
    <title>Van Fantasy Online</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #120e22; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; position: relative; z-index: 1; }
      /* Phaser's DOM container (text inputs) must sit above the canvas to be tappable. */
      #game > div { z-index: 2 !important; }
      #safe-probe {
        position: fixed; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 1000;
        background: #1a1430; color: #ffe9a8; font-family: 'Press Start 2P', monospace;
        font-size: 14px; line-height: 1.8; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      }
      #rotate .phone {
        width: 48px; height: 80px; border: 4px solid #ffe9a8; border-radius: 8px;
        animation: rot 2s ease-in-out infinite;
      }
      @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) { #rotate { display: flex; } }
      #boot-msg {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #ffe9a8; font-family: monospace; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="boot-msg">Loading...</div>
    <div id="game"></div>
    <div id="safe-probe"></div>
    <div id="rotate"><div class="phone"></div><div>Please rotate<br />your device</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
