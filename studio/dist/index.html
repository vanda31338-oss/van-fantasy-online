<title>Legend Shorts Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;600&family=Silkscreen&display=swap">
<style>/* Layout: a dark editing-suite shell; one working column, pixel accents (gold = tomb treasure, cyan/magenta = the channel's RGB-split glitch). */
:root {
  --bg: #eef0f5; --panel: #ffffff; --panel2: #f5f6fa; --line: #d8dae6; --fg: #19172a; --muted: #5d5970;
  --accent: #946512; --accent-fg: #ffffff; --accent-soft: #f6e7c8; --cy: #0b8f99; --mg: #c2185b;
  --ok: #1d7f4c; --ok-soft: #dcf2e5; --warn: #8a5a00; --warn-soft: #fbedd0; --err: #b3261e; --err-soft: #fbe0de;
  --mark: #ffe58a; --shadow: 0 1px 2px rgba(25, 23, 42, 0.08), 0 6px 22px rgba(25, 23, 42, 0.06);
  --f-display: "Kanit", "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", "Thonburi", sans-serif;
  --f-pixel: "Silkscreen", ui-monospace, monospace; --f-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px; --glow: 0 0 0 1px rgba(240, 180, 67, 0.35), 0 10px 30px rgba(240, 180, 67, 0.12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #110f18; --panel: #1a1724; --panel2: #221e2e; --line: #312c40; --fg: #ece8f4; --muted: #a49db6;
  --accent: #f0b443; --accent-fg: #1b1206; --accent-soft: #3a2c12; --cy: #3be0e8; --mg: #ff4f8b;
  --ok: #59d38c; --ok-soft: #173326; --warn: #f0c060; --warn-soft: #3a2e12; --err: #ff7b72; --err-soft: #3b1817;
  --mark: #6b5414; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 26px rgba(0, 0, 0, 0.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #110f18; --panel: #1a1724; --panel2: #221e2e; --line: #312c40; --fg: #ece8f4; --muted: #a49db6;
  --accent: #f0b443; --accent-fg: #1b1206; --accent-soft: #3a2c12; --cy: #3be0e8; --mg: #ff4f8b;
  --ok: #59d38c; --ok-soft: #173326; --warn: #f0c060; --warn-soft: #3a2e12; --err: #ff7b72; --err-soft: #3b1817;
  --mark: #6b5414; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 26px rgba(0, 0, 0, 0.35); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: radial-gradient(1200px 500px at 85% -10%, rgba(59, 224, 232, 0.07), transparent 60%), radial-gradient(900px 480px at -10% 0%, rgba(240, 180, 67, 0.08), transparent 60%), var(--bg); background-attachment: fixed; } }
:root[data-theme="dark"] body { background: radial-gradient(1200px 500px at 85% -10%, rgba(59, 224, 232, 0.07), transparent 60%), radial-gradient(900px 480px at -10% 0%, rgba(240, 180, 67, 0.08), transparent 60%), var(--bg); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 80px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; } .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; } .sp { flex: 1; }
.label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.logo { font-family: var(--f-pixel); font-size: 15px; width: 34px; height: 34px; display: grid; place-items: center; background: #0b0a12; color: #ffe66b; text-shadow: -2px 0 var(--mg), 2px 0 var(--cy); border-radius: 6px; }
.brand-t { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.bar-mid { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 14px; }
.bar-r { display: flex; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.job-chip { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.icon-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-size: 18px; }
@media (max-width: 620px) { .brand-t { display: none; } .bar-mid { display: none; } .chip { max-width: 150px; } }

/* step bar */
.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 19; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; }
.steps-in { max-width: 1180px; margin: 0 auto; display: flex; gap: 6px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); min-width: max-content; }
.st { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px 6px 6px; cursor: pointer; font-size: 14px; color: var(--muted); }
.st[disabled] { cursor: not-allowed; opacity: 0.55; }
.st .n { font-family: var(--f-pixel); font-size: 12px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; background: var(--panel2); color: var(--muted); }
.st.cur { border-color: var(--accent); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.st.cur .n { background: var(--accent); color: var(--accent-fg); }
.st.ok .n { background: var(--ok-soft); color: var(--ok); }
.st.recheck .n { background: var(--warn-soft); color: var(--warn); }
.st .tag { font-size: 11px; color: var(--warn); }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel + .panel { margin-top: 14px; }
.sec { display: flex; flex-direction: column; gap: 14px; }
.step-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.step-head .eyebrow { font-family: var(--f-pixel); font-size: 12px; color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; transition: border-color 0.15s, filter 0.15s, transform 0.05s; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; box-shadow: 0 4px 14px rgba(240, 180, 67, 0.25); }
.btn.pri:hover { filter: brightness(1.06); border-color: var(--accent); }
.btn.big { padding: 12px 22px; font-size: 16px; border-radius: 10px; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--panel); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--err); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; background: var(--panel2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.err { background: var(--err-soft); color: var(--err); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
.err-line { color: var(--err); background: var(--err-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.note { background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--fg); }
.note.ok { background: var(--ok-soft, var(--panel2)); border-color: transparent; }
.undo-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
input[type=text], input[type=number], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 9px 11px; }
textarea { resize: vertical; min-height: 74px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.thinking { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.thinking .px { width: 12px; height: 12px; background: var(--accent); animation: blink 0.9s steps(2) infinite; }
.stream { font-family: var(--f-mono); font-size: 12px; color: var(--muted); max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-all; background: var(--panel2); border-radius: 8px; padding: 8px; }
@keyframes blink { 50% { opacity: 0.2; } }
@media (prefers-reduced-motion: reduce) { .thinking .px { animation: none; } }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.topic-box { display: flex; flex-direction: column; gap: 14px; }
.topic-in { display: flex; gap: 10px; }
.topic-in input { font-size: 18px; padding: 12px 14px; }
.topic-in label { font-family: var(--f-display); font-size: 18px; align-self: center; white-space: nowrap; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; }
.proj-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.proj { display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 14px; cursor: pointer; }
.proj:hover { border-color: var(--accent); }
.proj .t { font-family: var(--f-display); font-size: 17px; }
.prog { display: flex; gap: 3px; } .prog i { width: 18px; height: 6px; border-radius: 2px; background: var(--line); } .prog i.ok { background: var(--ok); } .prog i.cur { background: var(--accent); } .prog i.re { background: var(--warn); }
.demo-cv { width: 100%; max-width: 270px; aspect-ratio: 9 / 16; image-rendering: pixelated; border-radius: 8px; background: #0b0a12; display: block; margin: 0 auto; }
.boot { display: grid; place-items: center; gap: 12px; padding: 40px 0; color: var(--muted); }
.boot canvas { width: 180px; height: 320px; image-rendering: pixelated; border-radius: 8px; background: #0b0a12; }

/* pitch */
.pitch-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 860px) { .pitch-grid { grid-template-columns: 1fr; } }
.pitch-title { font-family: var(--f-display); font-size: 32px; line-height: 1.2; }
.beats-list { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.loopline { font-family: var(--f-display); font-size: 17px; background: var(--panel2); border-radius: 8px; padding: 10px 12px; }
.loopline b { color: var(--accent); font-weight: 600; }
table.facts, table.beats { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.facts th, table.facts td, table.beats th, table.beats td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.facts th, table.beats th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel2); position: sticky; top: 0; white-space: nowrap; }
table.beats { min-width: 1080px; } table.beats td { min-width: 70px; }
table.beats tr.cta td { background: var(--accent-soft); }
.kw { color: var(--accent); font-weight: 600; }
.ver { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ver button { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 2px 9px; font-size: 12px; cursor: pointer; font-family: var(--f-mono); }
.ver button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.edit-box { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; background: var(--panel2); border-radius: 8px; padding: 12px; }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.card.ok { border-color: var(--ok); }
.card .stage { position: relative; background: #0b0a12 repeating-conic-gradient(#14121c 0 25%, #0b0a12 0 50%) 0 0 / 16px 16px; display: grid; place-items: center; min-height: 200px; }
.card .stage canvas { image-rendering: pixelated; max-width: 100%; }
.stage-wrap { display: flex; flex-direction: column; }
.card .tools { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px; background: #0b0a12; border-top: 1px solid rgba(255, 255, 255, 0.08); }
.card .stage { min-height: 230px; padding: 10px; }
.card .tools button { background: rgba(11, 10, 18, 0.78); color: #ece8f4; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
.card .tools button.on { background: #f0b443; color: #1b1206; border-color: #f0b443; }
.card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .nm { font-family: var(--f-display); font-size: 17px; }
.card .acts { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.card .kind { font-family: var(--f-pixel); font-size: 10px; color: var(--accent); letter-spacing: 0.04em; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.sw { width: 26px; height: 26px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.25); cursor: pointer; position: relative; }
.sw:hover::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; text-shadow: 0 0 3px #000; font-weight: 700; }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); color: var(--fg); }
.conv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.conv canvas { width: 100%; image-rendering: pixelated; background: repeating-conic-gradient(#2a2633 0 25%, #1e1b26 0 50%) 0 0 / 16px 16px; border-radius: 8px; }

/* voice */
.wave { width: 100%; height: 90px; display: block; background: var(--panel2); border-radius: 8px; }
.meter { display: flex; gap: 6px; align-items: flex-end; height: 70px; }
.meter i { flex: 1; background: var(--ok); border-radius: 3px 3px 0 0; min-height: 3px; }
.meter i.off { background: var(--warn); }

/* player */
.studio { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .studio { grid-template-columns: 1fr; } }
.screen { background: #0b0a12; border-radius: 12px; padding: 10px; display: grid; place-items: center; }
.screen canvas { image-rendering: pixelated; display: block; max-width: 100%; height: auto; }
.scrub { width: 100%; accent-color: var(--accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.check { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel2); }
.check b { display: block; font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.deliver textarea { font-size: 13px; min-height: 120px; }
.progress { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--accent); width: 0; }

/* modal */
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(8, 6, 16, 0.6); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(860px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 20px; box-shadow: var(--shadow); }
.dlg-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.set-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; }
@media (max-width: 700px) { .set-grid { grid-template-columns: 1fr; } }
.ch-list { display: flex; flex-direction: column; gap: 6px; }
.ch-list button { text-align: left; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.ch-list button.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.form2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .form2 { grid-template-columns: 1fr; } }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--fg); color: var(--bg); border-radius: 10px; padding: 9px 13px; font-size: 14px; line-height: 1.4; box-shadow: var(--shadow); transition: opacity 0.4s; }
@media (max-width: 620px) { #toasts { left: 16px; right: 16px; max-width: none; } .toast { font-size: 13px; } }
.toast.err { background: var(--err); color: #fff; } .toast.warn { background: var(--warn); color: #fff; } .toast.out { opacity: 0; }
.toast-act { margin-left: 10px; background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 6px; padding: 2px 8px; font: inherit; font-weight: 600; cursor: pointer; pointer-events: auto; }
.toast { pointer-events: auto; }
.undo-bar.prev { background: var(--panel2); }
#notice:empty { display: none; }
.banner { max-width: 1180px; margin: 10px auto 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.banner > div { border-radius: 8px; padding: 10px 14px; font-size: 14px; background: var(--warn-soft); }
.kbd { font-family: var(--f-mono); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.issues { display: flex; flex-direction: column; gap: 6px; }

/* ---------- home: hero + genre picker ---------- */
.eyebrow { font-family: var(--f-pixel); font-size: 12px; color: var(--accent); letter-spacing: 0.04em; }
.home-hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: center; padding: 8px 0 6px; }
@media (max-width: 860px) { .home-hero { grid-template-columns: 1fr; } }
.hh-copy { gap: 14px; }
.hh-t { font-size: clamp(30px, 5vw, 46px); line-height: 1.15; }
.hl { background: linear-gradient(90deg, var(--accent), #ff8a4c 55%, var(--mg)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.qual { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .qual { grid-template-columns: 1fr; } }
.qual .q { display: flex; gap: 8px; align-items: center; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.qual .q b { font-size: 16px; }
.hh-demo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hh-demo .demo-cv { max-width: 250px; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, 0.45); border-radius: 14px; }
.demo-cap { text-align: center; }
.sec-t { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; font-size: 20px; }

<script>// Legend Shorts Engine — shared helpers (colour, palette, rng). Plain script, global LSE.
(function (G) {
  const LSE = (G.LSE = G.LSE || {});

  // deterministic RNG (mulberry32)
  LSE.rng = function (seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  LSE.hash = function (str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };

  LSE.rgba = (h, a) => { const [r, g, b] = LSE.hexToRgb(h); return `rgba(${r},${g},${b},${a})`; };
  LSE.hexToRgb = function (h) {
    h = String(h || '#000').replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h.slice(0, 6), 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  LSE.rgbToHex = function (r, g, b) {
    return '#' + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  };
  LSE.isHex = (s) => /^#?[0-9a-fA-F]{6}$/.test(String(s || '').trim());
  LSE.parseHexList = function (text) {
    const out = [];
    String(text || '').replace(/#?([0-9a-fA-F]{6})\b/g, (_, h) => { out.push('#' + h.toLowerCase()); return ''; });
    return [...new Set(out)];
  };

  // OKLab
  function srgbToLin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function linToSrgb(c) { const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.max(0, Math.min(255, Math.round(v * 255))); }
  LSE.rgbToOklab = function (r, g, b) {
    const R = srgbToLin(r), Gx = srgbToLin(g), B = srgbToLin(b);
    const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * Gx + 0.0514459929 * B);
    const m = Math.cbrt(0.2119034982 * R + 0.6806995451 * Gx + 0.1073969566 * B);
    const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * Gx + 0.6299787005 * B);
    return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
  };
  LSE.oklabToRgb = function (L, a, b) {
    const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    const s = Math.pow(L - 0.0894841775 * a - 1.291485548 * b, 3);
    return [linToSrgb(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
      linToSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
      linToSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s)];
  };

  // Palette snapper with cache: nearest entry in OKLab (lightness weighted a little more)
  LSE.makeSnapper = function (hexList) {
    const pal = (hexList || []).map((h) => { const c = LSE.hexToRgb(h); return { c, lab: LSE.rgbToOklab(c[0], c[1], c[2]) }; });
    const cache = new Map();
    function snap(r, g, b) {
      if (!pal.length) return [r, g, b];
      const key = (r << 16) | (g << 8) | b;
      let v = cache.get(key);
      if (v) return v;
      const lab = LSE.rgbToOklab(r, g, b);
      let best = pal[0], bd = 1e9;
      for (const p of pal) {
        const dL = (lab[0] - p.lab[0]) * 1.3, da = lab[1] - p.lab[1], db = lab[2] - p.lab[2];
        const d = dL * dL + da * da + db * db;
        if (d < bd) { bd = d; best = p; }
      }
      v = best.c; cache.set(key, v); return v;
    }
    snap.size = pal.length;
    return snap;
  };
  // detail-preserving palette matching for LPC layers: keep each pixel's lightness (so ramps and shading
  // survive), pull its hue/chroma toward the nearest palette colour so it sits in the scene's tone
  LSE.makeHarmonizer = function (hexList, strength) {
    strength = strength ?? 0.7;
    const pal = (hexList || []).map((h) => { const c = LSE.hexToRgb(h); return LSE.rgbToOklab(c[0], c[1], c[2]); });
    const cache = new Map();
    function harm(r, g, b) {
      if (!pal.length) return [r, g, b];
      const key = (r << 16) | (g << 8) | b; let v = cache.get(key); if (v) return v;
      const lab = LSE.rgbToOklab(r, g, b); let best = pal[0], bd = 1e9;
      for (const p of pal) { const dL = (lab[0] - p[0]) * 0.6, da = lab[1] - p[1], db = lab[2] - p[2]; const d = dL * dL + da * da + db * db; if (d < bd) { bd = d; best = p; } }
      v = LSE.oklabToRgb(lab[0] * (1 - strength * 0.25) + best[0] * strength * 0.25, lab[1] + (best[1] - lab[1]) * strength, lab[2] + (best[2] - lab[2]) * strength);
      cache.set(key, v); return v;
    }
    harm.size = pal.length; return harm;
  };
  LSE.snapImageData = function (img, snap) {
    if (!snap || !snap.size) return img;
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 8) { d[i + 3] = 0; continue; }
      const c = snap(d[i], d[i + 1], d[i + 2]);
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    return img;
  };
  LSE.shade = function (hex, k) { // k<0 darker, k>0 lighter, in OKLab L
    const c = LSE.hexToRgb(hex); const lab = LSE.rgbToOklab(c[0], c[1], c[2]);
    const o = LSE.oklabToRgb(Math.max(0, Math.min(1, lab[0] + k)), lab[1] * (k < 0 ? 1 + k : 1), lab[2] * (k < 0 ? 1 + k : 1));
    return LSE.rgbToHex(o[0], o[1], o[2]);
  };
  LSE.mix = function (h1, h2, t) {
    const a = LSE.hexToRgb(h1), b = LSE.hexToRgb(h2);
    return LSE.rgbToHex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
  };

  LSE.canvas = function (w, h) {
    let c;
    if (typeof OffscreenCanvas !== 'undefined' && LSE.useOffscreen) c = new OffscreenCanvas(w, h);
    else { c = document.createElement('canvas'); c.width = w; c.height = h; }
    const ctx = c.getContext('2d', { willReadFrequently: false });
    ctx.imageSmoothingEnabled = false;
    return { c, ctx };
  };
  LSE.loadImage = function (src) {
    return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('โหลดรูปไม่ได้: ' + src)); im.src = src; });
  };
  // loop-safe time quantisers: L is a whole number of steps, so nudge to avoid k-1e-12 flooring to k-1
  LSE.tick = (t, step) => Math.floor(t / step + 1e-6);
  LSE.frac = (t, P) => ((t / P + 1e-6) % 1 + 1) % 1;
  LSE.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  LSE.lerp = (a, b, t) => a + (b - a) * t;
  LSE.ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  // Default master palette for the channel (dark, mysterious but vivid; 32 colours)
  LSE.DEFAULT_PALETTE = [
    '#0b0a12', '#16141f', '#231f33', '#2f2a47', '#3d3a5c', '#545577', '#7a7fa3', '#b3b9d1',
    '#f2efe6', '#ffffff', '#3b1f1a', '#5c3424', '#8a5232', '#b8773f', '#d9a35b', '#f2d38a',
    '#4a1220', '#7d1c2b', '#b52b35', '#e0533f', '#ff8a4c', '#ffc14a', '#ffe66b', '#1b3a3a',
    '#24605a', '#2f9c86', '#6fd6b0', '#183057', '#2253a3', '#3e8de0', '#8fd3ff', '#9b5de5',
  ];

// Pixel maps (palette + char rows) and the image -> pixel art converter.
(function (G) {
  const LSE = G.LSE;
  const Pixel = (LSE.Pixel = {});
  const cache = new Map();

  // map: {w,h,pal:{a:'#hex'}, rows:['..aa..'], flip?}
  Pixel.validate = function (m) {
    if (!m || typeof m !== 'object') return 'ไม่มีข้อมูลพิกเซล';
    if (!Array.isArray(m.rows) || !m.rows.length) return 'rows ว่าง';
    if (!m.pal || typeof m.pal !== 'object') return 'ไม่มี pal';
    const w = Math.max(...m.rows.map((r) => String(r).length));
    if (w > 280 || m.rows.length > 280) return 'ใหญ่เกิน 280px';
    return null;
  };
  Pixel.size = function (m) { return { w: Math.max(...m.rows.map((r) => String(r).length)), h: m.rows.length }; };

  Pixel.bitmap = function (m, snap) {
    const key = (m.__k || (m.__k = 'p' + LSE.hash(JSON.stringify([m.pal, m.rows])))) + (m.flip ? 'f' : '') + (snap ? snap.id || '' : '');
    let bm = cache.get(key);
    if (bm) return bm;
    const { w, h } = Pixel.size(m);
    const { c, ctx } = LSE.canvas(Math.max(1, w), Math.max(1, h));
    const img = ctx.createImageData(c.width, c.height); const d = img.data;
    const pal = {};
    for (const k in m.pal) { const v = m.pal[k]; if (LSE.isHex(v)) pal[k] = LSE.hexToRgb(v.startsWith('#') ? v : '#' + v); }
    for (let y = 0; y < h; y++) {
      const row = String(m.rows[y] || '');
      for (let x = 0; x < row.length; x++) {
        const ch = row[x]; const col = pal[ch];
        if (!col) continue;
        let rgb = col; if (snap) rgb = snap(col[0], col[1], col[2]);
        const xx = m.flip ? w - 1 - x : x;
        const i = (y * c.width + xx) * 4;
        d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    cache.set(key, c);
    return c;
  };

  // ---- shape drawing (how the house props are drawn): {w,h,ops:[[op,...]],outline:'#hex'|null} -> pixel map ----
  // ops, painted in order (later on top): ["rect",x,y,w,h,c] ["line",x0,y0,x1,y1,c] ["circle",cx,cy,r,c] ["ellipse",cx,cy,rx,ry,c]
  // ["poly",[[x,y],...],c] ["px",x,y,c] ["dots",[[x,y],...],c] ["clear",x,y,w,h]; outline = 1px rim drawn last around every shape
  const OPS = ['rect', 'line', 'circle', 'ellipse', 'poly', 'px', 'dots', 'clear'];
  Pixel.validateOps = function (d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.ops) || !d.ops.length) return 'ต้องมี ops';
    if (!(d.w >= 4 && d.w <= 160 && d.h >= 4 && d.h <= 160)) return 'w/h ต้องอยู่ระหว่าง 4–160';
    for (const o of d.ops) if (!Array.isArray(o) || !OPS.includes(o[0])) return 'op ไม่รู้จัก: ' + JSON.stringify(o).slice(0, 40);

  };

    const w = Math.round(d.w), h = Math.round(d.h); const g = Array.from({ length: h }, () => Array(w).fill(null));
    const col = (c) => (typeof c === 'string' && LSE.isHex(c) ? (c.startsWith('#') ? c : '#' + c).toLowerCase() : null);
    const px = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = c; };
    const rect = (x, y, ww, hh, c) => { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) px(x + i, y + j, c); };
    const line = (x0, y0, x1, y1, c) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for (let k = 0; k <= n; k++) px(x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n, c); };
    const ellipse = (cx, cy, rx, ry, c) => { rx = Math.max(0.5, rx); ry = Math.max(0.5, ry); for (let y = -Math.ceil(ry); y <= ry; y++) for (let x = -Math.ceil(rx); x <= rx; x++) if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1.02) px(cx + x, cy + y, c); };
    const poly = (pts, c) => { // even-odd scanline fill, then the edges so thin shapes stay visible
      if (!Array.isArray(pts) || pts.length < 3) return;
      const ys = pts.map((p) => p[1]); for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(Math.max(...ys)); y++) {
        const xs = []; for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length]; if ((ay <= y + 0.5 && by > y + 0.5) || (by <= y + 0.5 && ay > y + 0.5)) xs.push(ax + (y + 0.5 - ay) / (by - ay) * (bx - ax)); }
        xs.sort((a, b) => a - b); for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x < Math.round(xs[i + 1]); x++) px(x, y, c);
      }
      for (let i = 0; i < pts.length; i++) line(pts[i][0], pts[i][1], pts[(i + 1) % pts.length][0], pts[(i + 1) % pts.length][1], c);

      else if (k === 'html') el.innerHTML = v; else if (v === true) el.setAttribute(k, ''); else el.setAttribute(k, v);
    }
    for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
    return el;
  };

  App.diffHTML = function (oldS, newS) {
    oldS = String(oldS ?? ''); newS = String(newS ?? '');
    if (oldS === newS) return App.esc(newS);
    const a = [...oldS], b = [...newS];
    if (a.length * b.length > 250000) return '<mark>' + App.esc(newS) + '</mark>';
    const n = a.length, m = b.length; const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0, out = '', run = '';
    const flush = () => { if (run) { out += '<mark>' + App.esc(run) + '</mark>'; run = ''; } };
    while (j < m) {
      if (i < n && a[i] === b[j]) { flush(); out += App.esc(b[j]); i++; j++; }
      else if (i < n && dp[i + 1][j] >= dp[i][j + 1]) i++;
      else { run += b[j]; j++; }
    }
    flush(); return out;
  };
  // field-level: returns html for value with diff vs old (strings/arrays)
  App.dv = function (cur, old) {
    if (old === undefined || old === null) return App.esc(typeof cur === 'string' ? cur : JSON.stringify(cur));
    if (typeof cur === 'string') return App.diffHTML(typeof old === 'string' ? old : '', cur);
    return App.diffHTML(JSON.stringify(old), JSON.stringify(cur));
  };

  };

  // save a file through the downloads capability
  App.save = async function (filename, data) {
    const d = App.caps.downloads;
    if (!d) { App.toast('มุมมองนี้บันทึกไฟล์ไม่ได้ เปิดอาร์ติแฟกต์ใน claude.ai', 'err'); return false; }
    try { await d.save({ filename, data }); App.toast('บันทึก ' + filename + ' แล้ว'); return true; }
    catch (e) { if (e && e.code === 'declined') App.toast('ยกเลิกการบันทึก'); else App.toast(App.errText(e), 'err'); return false; }
  };

  App.anim = { t0: performance.now() };

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  App.base64ToF32 = function (b64) {
    const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const i16 = new Int16Array(u.buffer); const f = new Float32Array(i16.length); for (let i = 0; i < f.length; i++) f[i] = i16[i] / 32768; return f;
  };
})();

${G.beats}

RULES

    const tags = (o.hashtags || (App.st.project.beats || {}).hashtags || []).join(' ');
    const desc = [o.description || '', 'ตอนในคลิปนี้\n' + chapLines, tags, cr.text].filter(Boolean).join('\n\n');
    const fileBase = () => (title || 'legend-long').replace(/[\\/:*?"<>|]+/g, '').slice(0, 60).trim() || 'legend-long';
    const prog = h('div', { class: 'progress', hidden: true }, h('i', {})); const progT = h('span', { class: 'small muted' });
    let ctl = null;
    const run = async (btn, list, name, bitrate) => { // list = chapter numbers, encoded back to back into one file
      const sup = await LSE.exportSupport();
      if (!sup.video) { const id = await App.queueJob('render_long', { pid: App.st.pid, chapters: list, fps: 30, w: 1080, h: 1920 }, 'เรนเดอร์คลิปยาวทีละตอนฝั่ง Claude Code แล้วอัปโหลด'); box.prepend(App.jobNote(App.st.jobs[id])); return; }
      btn.disabled = true; prog.hidden = false; ctl = new AbortController(); App.player && App.player.stop();
      try {
        const { blob, ext } = await LSE.exportSequence(list.length, (k) => L.runtime(list[k]), (f, msg) => { prog.firstChild.style.width = Math.round(f * 100) + '%'; progT.textContent = msg + ' · ' + Math.round(f * 100) + '%'; }, ctl.signal, { bitrate });
        progT.textContent = 'เข้ารหัสเสร็จ ' + (blob.size / 1e6).toFixed(1) + ' MB (' + ext.toUpperCase() + ')';
        await App.save(name + '.' + ext, blob);
      } catch (e) { progT.textContent = ''; App.toast('บันทึกวิดีโอไม่สำเร็จ: ' + App.errText(e), 'err'); }
      btn.disabled = false;
    };
    const allBtn = h('button', { class: 'btn pri', onclick: () => run(allBtn, chs.map((c) => c.n), fileBase(), 3.5e6) }, 'บันทึกคลิปเต็ม (.mp4)');
    const oneBtn = h('button', { class: 'btn', onclick: () => run(oneBtn, [L.cur], fileBase() + ' ตอน ' + L.cur, 6e6) }, 'บันทึกเฉพาะตอนที่เลือก');
    const stopBtn = h('button', { class: 'btn ghost sm', onclick: () => ctl && ctl.abort() }, 'ยกเลิก');
    const ta = (v, rows) => h('textarea', { readonly: true, rows }, v);
    box.append(h('div', { class: 'panel col deliver' }, h('h3', {}, 'ส่งงาน Long'),
      h('div', { class: 'row' }, allBtn, oneBtn, stopBtn), h('span', { class: 'small muted' }, '1080×1920 · 30 fps · H.264 + AAC · คลิปเต็ม ~' + fmtMin(marks.length ? marks[marks.length - 1].t + lenOf(chs.length) : 0) + ' นาที ใช้เวลาเรนเดอร์หลายนาที (บนมือถือแนะนำให้บันทึกทีละตอน)'), prog, progT,
      h('div', { class: 'field' }, h('span', {}, 'ชื่อคลิปบน YouTube'), ta(title, 2), h('div', { class: 'row' }, h('button', { class: 'btn sm', onclick: (e) => App.copy(title, e.target) }, 'คัดลอกชื่อ'))),
      h('div', { class: 'field' }, h('span', {}, 'คำอธิบาย + สารบัญตอน (YouTube Chapters)'), ta(desc, 12), h('div', { class: 'row' }, h('button', { class: 'btn sm', onclick: (e) => App.copy(desc, e.target) }, 'คัดลอกคำอธิบาย'))),
      h('p', { class: 'small muted' }, 'เวลาของแต่ละตอนแม่นเมื่อประกอบตอนนั้นแล้วอย่างน้อยหนึ่งครั้ง (เล่นหรือบันทึก) · เครดิต LPC ใส่ไว้ท้ายคำอธิบายแล้ว')));
  }
})();

// Boot: draw something at once, then capabilities, catalog, channels, projects.
(function () {
  const App = window.App;
  async function boot() {
    // frame 0 right away: the desert scene from the example, no network needed
    try {
      const cv = App.$('#bootCanvas'); const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
      const s = LSE.SAMPLE.scenes[1]; const built = LSE.Scene.build(Object.assign({ id: s.id, name: s.name }, s.spec), { palette: LSE.SAMPLE.palette });
      const draw = (now) => { if (!cv.isConnected) return; App.drawScenePreview(ctx, built, now / 1000); requestAnimationFrame(draw); }; requestAnimationFrame(draw);
    } catch (e) { /* splash is decoration */ }
    App.$('#brand').onclick = () => { App.st.view = 'home'; App.st.project = null; App.st.pid = null; App.loadProjects().then(App.render); };
    App.$('#gear').onclick = () => App.openSettings();
    App.$('#chChip').onclick = () => App.openSettings();
    App.$('#jobChip').onclick = () => App.toast('พิมพ์ "ทำงานค้าง" ในแชต Claude Code เพื่อให้ทำงานที่รออยู่', 'warn');
    const fonts = LSE.loadFonts();
    try { await App.initCaps(); } catch (e) { /* treated as absent */ }
    App.renderNotice();
    try { await LSE.LPC.load('lpc/'); } catch (e) { App.toast(App.errText(e), 'err'); }
    await Promise.all([App.loadChannels(), App.loadProjects(), App.loadLibrary(), fonts]);
    App.watchJobs();
    App.render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
